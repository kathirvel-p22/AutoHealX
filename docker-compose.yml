version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: autohealx-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-autohealx}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - autohealx-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Backend API
  autohealx-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autohealx-backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-autohealx}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - autohealx-network
    restart: unless-stopped
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # Frontend Web Application
  autohealx-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autohealx-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - VITE_APP_NAME=AutoHealX
      - VITE_APP_VERSION=1.0.0
      - VITE_API_URL=http://autohealx-backend:4000
    restart: unless-stopped
    networks:
      - autohealx-network
    depends_on:
      - autohealx-backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Agent (Monitoring)
  autohealx-agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: autohealx-agent
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://autohealx-backend:4000
    restart: unless-stopped
    networks:
      - autohealx-network
    depends_on:
      - autohealx-backend
    volumes:
      - ./config:/app/config

networks:
  autohealx-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  backend_logs:
    driver: local
  config-data:
    driver: local
