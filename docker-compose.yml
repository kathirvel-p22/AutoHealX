version: '3.8'

services:
  autohealx-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autohealx-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - VITE_APP_NAME=AutoHealX
      - VITE_APP_VERSION=1.0.0
    restart: unless-stopped
    networks:
      - autohealx-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  autohealx-agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: autohealx-agent
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - autohealx-network
    depends_on:
      - autohealx-web
    volumes:
      - ./config:/app/config

networks:
  autohealx-network:
    driver: bridge

volumes:
  config-data:
